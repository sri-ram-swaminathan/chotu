# MASTER CV — the single source of truth for every CV Chotu tailors.
# This is an EXAMPLE profile ("Alex Example"). Replace everything with your own details.
# Tailored CVs only SELECT / REORDER / REWORD bullets from here (numbers can't be invented),
# so add everything — even things that don't fit on one page.
# Order entries newest first: tailored CVs keep this order.
# `stack` prints after the title in the LaTeX CV ("Machine Learning Intern | Python, PyTorch").
#
# ⚠️ Privacy: if you fork this repo publicly, keep your real CV out of git
#    (e.g. keep it in a private fork, or `git update-index --skip-worktree profile/cv.yaml`).

