# Companies to track + pages to watch. Everything runs once every 24 hours.
#
# companies: anything with a public job board (ATS) is polled every `fetch_every_hours`.
#   boards.greenhouse.io/<slug> → greenhouse     jobs.lever.co/<slug> → lever (lever-eu for jobs.eu.lever.co)
#   jobs.ashbyhq.com/<slug>     → ashby          <slug>.recruitee.com → recruitee
#   <slug>.jobs.personio.de     → personio       apply.workable.com/<slug> → workable
#   <tenant>.wd3.myworkdayjobs.com/<site> → workday, slug "tenant.wd3/site" (+ optional `search` terms)
# Companies WITHOUT a readable board are still tracked: set research: true for a dossier + outreach email,
# and subscribe your alerts inbox to their job alerts (see "Email alerts" at the bottom).
# Every ATS slug below was verified on 2026-11-11.

fetch_every_hours: 24

