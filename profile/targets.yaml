# Site-wide job boards (many companies each), from career-ops' supported boards. Read every fetch_every_hours.
# Only postings that pass the free filters (location, seniority, no internships, keywords) are stored.
# Providers: arbeitnow · landingjobs · speedrun · jobicy (+ geo) · startupjobs · hackernews — see src/sources/boards.ts.
boards:
  - { provider: arbeitnow, name: "Arbeitnow (EU/DACH)", pages: 3 }
  - { provider: landingjobs, name: "Landing.jobs (Europe)", pages: 2 }
  - { provider: speedrun, name: "a16z speedrun startups", pages: 3 }
  - { provider: jobicy, name: "Jobicy — Netherlands", geo: netherlands }
  - { provider: jobicy, name: "Jobicy — Europe", geo: europe }
  - { provider: startupjobs, name: "Startup Jobs" }
  - { provider: hackernews, name: "HN Who is hiring" }

# Pages without an API, re-read every 24 h. Only a CHANGED page costs an LLM call.
# Verified readable on 2026-11-11 with a plain fetch.
watch_pages:
  # Job boards
  - { url: "https://brainporteindhoven.com/nl/ontdek-brainport/werken", kind: job, every_hours: 24, note: "Brainport Eindhoven" }
  - { url: "https://www.makeitinthenorth.nl/", kind: job, every_hours: 24, note: "Make it in the North" }
  - { url: "https://www.utrechtinternationalcenter.com/en/job-portal", kind: job, every_hours: 24, note: "Utrecht International Center" }
  - { url: "https://jobs.workinsouthholland.nl/jobs", kind: job, every_hours: 24, note: "Work in South Holland" }
  - { url: "https://jobs.techeurope.io/", kind: job, every_hours: 24, note: "Tech Europe jobs" }
  - { url: "https://www.ycombinator.com/jobs", kind: job, every_hours: 24, note: "YC Work at a Startup" }
  # PhDs
  - { url: "https://www.academictransfer.com/en/jobs/?q=machine%20learning", kind: phd, every_hours: 24, note: "AcademicTransfer: ML" }
  - { url: "https://www.academictransfer.com/en/jobs/?q=computer%20vision", kind: phd, every_hours: 24, note: "AcademicTransfer: CV" }
  - { url: "https://www.academictransfer.com/en/jobs/?q=remote%20sensing", kind: phd, every_hours: 24, note: "AcademicTransfer: remote sensing" }
  - { url: "https://ellis.eu/phd-postdoc", name: "ELLIS PhD Program", kind: phd, every_hours: 24 }
  # Accelerators. A `name` makes the deadline agent track the program's batch deadlines automatically:
  # daily until it finds the next one, then weekly. Add any program the same way.
  - { url: "https://www.livetheresidency.com/", name: "The Residency", kind: accelerator, every_hours: 24 }
  - { url: "https://www.ycombinator.com/apply", name: "Y Combinator", kind: accelerator, every_hours: 24 }
  - { url: "https://www.antler.co/", name: "Antler", kind: accelerator, every_hours: 24 }
  - { url: "https://utrechtinc.nl/", name: "UtrechtInc", kind: accelerator, every_hours: 24 }
  - { url: "https://rockstart.com/", name: "Rockstart", kind: accelerator, every_hours: 24 }
  - { url: "https://www.hightechxl.com/", name: "HighTechXL", kind: accelerator, every_hours: 24 }
  - { url: "https://www.yesdelft.com/", name: "YES!Delft", kind: accelerator, every_hours: 24, note: "Delft deep-tech incubator (drones, space)" }
  - { url: "https://www.joinef.com/", name: "Entrepreneur First", kind: accelerator, every_hours: 24 }

# Deadline reminders (accelerator batches, PhD calls, postings, your own constraints.yaml deadlines)
deadlines:
  remind_days: [14, 7, 3, 1]
  search_every_days: 7

# Email alerts (send them to your job-alert inbox — the email agent reads them).
# These sites can't be read without a browser, so subscribe to their job alerts instead:
#   Welcome to the Jungle, EURES, werk.nl, Scaling Europe, ASML, Rabobank, ABN AMRO
# PhD mailing lists: ai-robotics@googlegroups.com, rl-list@googlegroups.com, ml-news@googlegroups.com,
#   CVNet, visionlist (visionscience.com)
# Not used: welcome-to-nl.nl (info portal, no listings), startupmap.one (JavaScript only).
