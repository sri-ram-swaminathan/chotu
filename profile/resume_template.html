<!doctype html>
<!-- BASE RESUME TEMPLATE. Every tailored resume is rendered into this file.
     Edit the HTML/CSS freely; keep the {{placeholders}}:
     {{name}} {{headline}} {{contact}} {{summary}} {{experience}} {{projects}} {{education}} {{skills}} {{awards}}
     Each entry renders as: .entry > .entry-head (.title .org .dates) + .loc + ul > li  -->
<html>
<head>
<meta charset="utf-8">
<title>{{name}} — Resume</title>
<style>
  @page { size: A4; margin: 13mm 14mm; }
  body { font: 10.2pt/1.34 "Charter", "Georgia", serif; color: #111; max-width: 790px; margin: 20px auto; }
  h1 { font-size: 21pt; margin: 0; letter-spacing: .01em; }
  .headline { font-size: 11pt; color: #333; margin-top: 2px; }
  .contact { font-size: 9.5pt; color: #444; margin-top: 4px; }
  .contact a { color: inherit; }
  h2 { font: 600 9.5pt/1 system-ui, sans-serif; text-transform: uppercase; letter-spacing: .1em; color: #1f3a8a;
       border-bottom: 1px solid #c8cbd2; padding-bottom: 3px; margin: 13px 0 6px; }
  .entry { margin-bottom: 6px; break-inside: avoid; }
  .entry-head { display: flex; gap: 4px; align-items: baseline; }
  .title { font-weight: 700; }
  .org { color: #333; }
  .dates { margin-left: auto; font-size: 9.5pt; color: #555; white-space: nowrap; }
  .loc { font-size: 9.5pt; color: #666; }
  ul { margin: 2px 0 0 16px; padding: 0; }
  li { margin: 1px 0; }
  .skills div { margin: 1px 0; }
  @media print { body { margin: 0; } }
</style>
</head>
<body>
  <h1>{{name}}</h1>
  <div class="headline">{{headline}}</div>
  <div class="contact">{{contact}}</div>

  <h2>Summary</h2>
  <p style="margin:0">{{summary}}</p>

  <h2>Experience</h2>
  {{experience}}

  <h2>Projects</h2>
  {{projects}}

  <h2>Education</h2>
  {{education}}

  <h2>Skills</h2>
  <div class="skills">{{skills}}</div>
</body>
</html>
