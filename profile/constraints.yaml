# Hard constraints — enforced by code (deterministic filters), not by the LLM.
# EXAMPLE values — set your own.

graduation: "2027-08"

visa:
  needs_sponsorship: true
  notes: >
    Non-EU student in the Netherlands. A highly-skilled-migrant permit needs an IND recognised sponsor.
    Funded startups not on the register are still worth pitching.

locations:
  # Substring match against the posting's location (lowercase). Keep both city and country names.
  preferred: [netherlands, nederland, amsterdam, eindhoven, rotterdam, delft, utrecht, leiden, the hague, den haag, groningen]
  acceptable: [berlin, munich, münchen, london, paris, zurich, zürich, brussels, europe, emea]
  allow_remote: false

seniority:
  # Titles containing these words are filtered out before any LLM call.
  exclude_title_words: [senior, sr, staff, principal, lead, head, director, manager, vp, architect]

# Opportunity types you don't want at all. Titles like "Intern", "Stagiair", "Werkstudent", "Thesis",
# "Praktikum" count as internships even when a board labels them as jobs.
exclude_kinds: [internship]

# If any of these phrases appear in a description, drop the job.
dealbreaker_phrases:
  - "fluent in dutch"
  - "native dutch"
  - "security clearance required"

# Your own deadlines (shown in the daily brief).
deadlines:
  - { date: "2027-08-01", what: "Graduation" }
